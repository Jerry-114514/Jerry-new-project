name: Core tests and smoke experiment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m intentlab build-data --out runs/data
      - run: python -m intentlab run --out runs/demo --repeats 1
      - run: python -m intentlab train-baseline --data runs/data/diagnostic_views.jsonl --out runs/training --epochs 6 --seeds 0
